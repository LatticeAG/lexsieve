[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latticeag-lexsieve"
version = "1.0.0"
description = "Return-path interceptor that delimits, classifies, and quarantines instructions hidden in tool results (protocol 1, core 1.0.0)."
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lexsieve-py = "lexsieve.cli:run"

[tool.setuptools]
packages = ["lexsieve", "lexsieve.eval"]

[tool.setuptools.package-data]
lexsieve = ["unicode_15_1.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
